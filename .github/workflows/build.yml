name: Build Retro-Chan APK
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }

      - name: Download emulator cores (libretro)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a tmp
          for c in fceumm snes9x gambatte mgba genesis_plus_gx mednafen_pce_fast; do
            curl -fL -o tmp/$c.zip "https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/${c}_libretro_android.so.zip"
            unzip -o tmp/$c.zip -d tmp
            mv tmp/${c}_libretro_android.so app/src/main/jniLibs/arm64-v8a/lib${c}_libretro_android.so
          done

      # OTOMATIS: kunci dibuat sekali di build pertama, disimpan di repo (keystore/retro-chan.jks),
      # lalu dipakai terus -> APK selalu bisa di-update tanpa install ulang.
      # (Jika GitHub Secrets diisi lengkap, secrets yang dipakai.)
      - name: Siapkan kunci tanda tangan (otomatis)
        env:
          S_KS: ${{ secrets.KEYSTORE_BASE64 }}
          S_SP: ${{ secrets.KEYSTORE_PASSWORD }}
          S_KA: ${{ secrets.KEY_ALIAS }}
          S_KP: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$S_KS" ] && [ -n "$S_SP" ] && [ -n "$S_KA" ] && [ -n "$S_KP" ]; then
            echo "Memakai kunci dari GitHub Secrets"
            echo "$S_KS" | base64 -d > "$GITHUB_WORKSPACE/retro-chan.jks"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/retro-chan.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$S_SP" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$S_KA" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$S_KP" >> "$GITHUB_ENV"
          else
            PASS="RetroChan-2026-Key"
            if [ ! -f keystore/retro-chan.jks ]; then
              echo "Membuat kunci baru (sekali saja)..."
              mkdir -p keystore
              keytool -genkeypair -keystore keystore/retro-chan.jks -alias retrochan \
                -keyalg RSA -keysize 2048 -validity 36500 \
                -storepass "$PASS" -keypass "$PASS" \
                -dname "CN=Retro-Chan, O=Retro-Chan, C=ID"
              git config user.name "retro-chan-bot"
              git config user.email "retro-chan-bot@users.noreply.github.com"
              git add -f keystore/retro-chan.jks
              git commit -m "Add signing keystore (auto-generated)"
              git push origin HEAD:main
            else
              echo "Memakai kunci yang sudah ada di repo"
            fi
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/keystore/retro-chan.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=retrochan" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: gradle :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Retro-Chan.apk

      - uses: actions/upload-artifact@v4
        with: { name: Retro-Chan, path: Retro-Chan.apk }

      - name: Publish release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: Retro-Chan.apk }
