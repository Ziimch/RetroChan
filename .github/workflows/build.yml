name: Build Retro-Chan APK
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }

      - name: Download emulator cores (libretro)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a tmp
          for c in fceumm snes9x gambatte mgba genesis_plus_gx mednafen_pce_fast; do
            curl -fL -o tmp/$c.zip "https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/${c}_libretro_android.so.zip"
            unzip -o tmp/$c.zip -d tmp
            mv tmp/${c}_libretro_android.so app/src/main/jniLibs/arm64-v8a/lib${c}_libretro_android.so
          done

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/retro-chan.jks"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/retro-chan.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Retro-Chan.apk

      - uses: actions/upload-artifact@v4
        with: { name: Retro-Chan, path: Retro-Chan.apk }

      - name: Publish release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: Retro-Chan.apk }
